name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          MAJOR_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ] || [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java runtime must be version 17 or higher. Found: $MAJOR_VERSION"
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Existing debug.keystore found in repository root."
          else
            echo "debug.keystore missing; generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore was not found or could not be generated."
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate Debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ] && [ -s "$APK_PATH" ] && [[ "$APK_PATH" == *.apk ]]; then
            echo "APK validated successfully at $APK_PATH (size: $(wc -c < "$APK_PATH") bytes)"
          else
            echo "Error: $APK_PATH does not exist, is empty, or is invalid."
            echo "Searching inside app/build/outputs/apk for any APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          STAGE_DIR=$(mktemp -d)
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${STAGE_DIR}/${ASSET_NAME}"
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Staged APK asset is missing, empty, or invalid: $ASSET_PATH"
            exit 1
          fi
          echo "Staged release asset at: $ASSET_PATH (size: $(wc -c < "$ASSET_PATH") bytes)"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset path is missing or invalid: $ASSET_PATH"
            exit 1
          fi
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<'EOF'
          ### Automated Debug APK Build
          This debug APK was automatically generated by GitHub Actions.

          - **Workflow Run:** #${{ github.run_number }} (attempt ${{ github.run_attempt }})
          - **Target Commit:** ${{ github.sha }}
          - **Keystore:** Signed with temporary Android debug keystore
          - **Intended Usage:** Internal testing and direct installation on Android devices. Not intended for Google Play Store production release.
          EOF
          )
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release published successfully."
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
            echo "Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: $ASSET_NAME"
            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "**Status:** ✅ GitHub Release published successfully."
              echo ""
              echo "- **Release Tag:** \`$TAG_NAME\`"
              echo "- **Title:** Debug APK Build #${{ github.run_number }}"
              echo "- **Release URL:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Downloadable APK Asset:** \`$ASSET_NAME\`"
              echo "- **Actions Artifact:** Available under artifacts as \`app-debug-apk\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation or publishing could not be completed (Outcome: ${{ steps.create_release.outcome }})."
            echo "The APK was assembled successfully and is available as workflow artifact: app-debug-apk"
            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "**Status:** ℹ️ Debug APK built successfully; GitHub Release creation step was skipped or did not complete."
              echo ""
              echo "- **APK Artifact:** \`app-debug-apk\` (available for download directly from the GitHub Actions run summary)"
              echo "- **Run Number:** #${{ github.run_number }}"
              echo "- **Commit:** \`${{ github.sha }}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
