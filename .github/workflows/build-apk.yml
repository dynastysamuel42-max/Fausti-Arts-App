name: Build Fausti Arts APK & Create Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fausti-arts-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Fausti Arts Mobile Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Fausti Arts Official Android APK
            - **Application:** Fausti Arts
            - **Tagline:** "Your Imagination, Our Creation."
            - **Package:** `com.aistudio.faustiarts.mrvxqk`
            - **Architecture:** Kotlin, Jetpack Compose, Room DB, Firebase AI Logic
            - **Download:** Download `app-debug.apk` below directly to your Android device.
